name: Build Cookbook Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build.js'
      - 'build-notebooks.js'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'cookbooks/**/*.html'
      - 'notebooks/**/*.ipynb'
      - 'build.js'
      - 'build-notebooks.js'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build HTML and Jupyter notebooks
        run: npm run build

      - name: Validate notebook coverage
        run: npm run check:notebooks

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- cookbooks/ notebooks/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require generated artifacts in pull requests
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed == 'true'
        run: |
          git status --short -- cookbooks/ notebooks/
          echo "Run 'npm run build' and commit the generated artifacts."
          exit 1

      - name: Commit and push generated artifacts
        if: github.event_name == 'push' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cookbooks/ notebooks/
          git commit -m "Auto-build: regenerate cookbook artifacts"
          git push
